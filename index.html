<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon's Pilates Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#2A2620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="打卡簿">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #E7E1D3;
    --bg-card: #FBF8F1;
    --ink: #2A2620;
    --ink-soft: #6E6656;
    --ink-faint: #A79E8C;
    --line: rgba(42,38,32,0.13);
    --line-strong: rgba(42,38,32,0.22);

    --c-reformer: #B8433C;
    --c-megaformer: #6B4F86;
    --c-cadillac: #3C6690;
    --c-chair: #4B7A56;
    --c-barre: #C99A32;

    --radius: 14px;
    --radius-sm: 9px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(42,38,32,0.055) 1px, transparent 0);
    background-size: 18px 18px;
    pointer-events:none;
    z-index:0;
  }

  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background: transparent;
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    padding-bottom: 84px;
  }

  header.top{
    padding: 26px 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  header.top .brand{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 26px;
    letter-spacing: 0.01em;
  }
  header.top .brand small{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top:2px;
  }
  header.top .stamp-total{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    text-align:right;
    line-height:1.4;
  }
  header.top .stamp-total b{
    display:block;
    font-size: 22px;
    color: var(--ink);
    font-weight:600;
  }

  main{
    flex:1;
    padding: 4px 18px 10px;
  }

  .card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 1px 0 rgba(42,38,32,0.03);
  }

  .section-label{
    font-size: 11px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin: 0 0 10px 2px;
  }

  /* ---- form ---- */
  label{
    display:block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 14px 0 6px;
    font-weight:500;
  }
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea{
    width:100%;
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    outline:none;
  }
  input:focus, select:focus, textarea:focus{
    border-color: var(--ink);
  }
  .row2{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
  }

  .type-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:8px;
  }
  .type-pill{
    border: 1.5px solid var(--line-strong);
    border-radius: 10px;
    padding: 10px 4px 9px;
    text-align:center;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background:#fff;
    cursor:pointer;
    user-select:none;
    position:relative;
    line-height:1.25;
  }
  .type-pill .ic{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:5px;
  }
  .type-pill .ic svg{ width:25px; height:25px; }
  .type-pill.active{
    color:#fff;
    border-color: transparent;
  }

  .select-row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .select-row select{ flex:1; }
  .icon-btn{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line-strong);
    background:#fff;
    color: var(--ink-soft);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .inline-add{
    display:none;
    gap:8px;
    margin-top:8px;
  }
  .inline-add.show{ display:flex; }
  .inline-add input{ flex:1; }
  .inline-add button{
    flex-shrink:0;
    border:none;
    border-radius: var(--radius-sm);
    padding: 0 14px;
    background: var(--ink);
    color: var(--bg-card);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }

  .pay-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:8px;
  }
  .pay-pill{
    border: 1.5px solid var(--line-strong);
    border-radius: 10px;
    padding: 10px 4px;
    text-align:center;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background:#fff;
    cursor:pointer;
  }
  .pay-pill.active{
    background: var(--ink);
    color: var(--bg-card);
    border-color: transparent;
  }

  .pkg-option{
    font-size:14px;
  }
  .pkg-info{
    font-size:12.5px;
    color: var(--ink-soft);
    background: rgba(42,38,32,0.05);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    margin-top:8px;
    line-height:1.5;
  }
  .pkg-new{
    margin-top:10px;
    padding-top:12px;
    border-top: 1px dashed var(--line-strong);
  }
  .mode-toggle{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .mode-toggle div{
    flex:1;
    text-align:center;
    padding:8px 4px;
    border:1.5px solid var(--line-strong);
    border-radius: var(--radius-sm);
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .mode-toggle div.active{
    background: var(--ink);
    color: var(--bg-card);
    border-color: transparent;
  }

  .btn{
    width:100%;
    border:none;
    border-radius: var(--radius-sm);
    padding: 13px;
    font-size: 15px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    background: var(--ink);
    color: var(--bg-card);
    cursor:pointer;
    margin-top: 18px;
  }
  .btn:active{ opacity:0.85; }
  .btn.ghost{
    background:transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line-strong);
    margin-top:8px;
    font-weight:500;
    font-size:13px;
  }
  .btn.small{
    padding:10px; font-size:13px; margin-top:10px;
  }

  /* ---- entry list ---- */
  .entry{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .swatch{
    width:30px; height:30px; border-radius:9px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .entry .swatch svg{ width:19px; height:19px; }
  .entry .meta{flex:1; min-width:0;}
  .entry .meta .l1{
    font-size:14px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .entry .meta .l2{
    font-size:12px; color:var(--ink-soft); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .entry .price{
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px; font-weight:600;
    flex-shrink:0;
    text-align:right;
  }
  .entry .price .tag{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:10px;
    color: var(--ink-faint);
    font-weight:500;
  }
  .entry .del{
    color: var(--ink-faint);
    font-size: 18px;
    padding: 4px 2px 4px 8px;
    cursor:pointer;
    flex-shrink:0;
  }

  .empty{
    text-align:center;
    color: var(--ink-faint);
    font-size: 13px;
    padding: 26px 10px;
    line-height:1.6;
  }

  /* ---- month switcher ---- */
  .month-switch{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 16px;
  }
  .month-switch .arrow{
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:16px;
    background:#fff;
    color: var(--ink-soft);
  }
  .month-switch .label{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
  }

  .big-stat{
    text-align:center;
    padding: 6px 0 18px;
  }
  .big-stat .num{
    font-family:'IBM Plex Mono', monospace;
    font-size: 40px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .big-stat .sub{
    font-size:12.5px;
    color: var(--ink-soft);
    margin-top:2px;
  }

  .bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 11px;
  }
  .bar-row .bname{
    width:96px; flex-shrink:0;
    font-size:12.5px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:flex; align-items:center; gap:6px;
  }
  .bar-row .bname svg{ width:14px; height:14px; flex-shrink:0; }
  .bar-row .btrack{
    flex:1;
    height:9px;
    background: var(--line);
    border-radius:5px;
    overflow:hidden;
  }
  .bar-row .bfill{
    height:100%;
    border-radius:5px;
  }
  .bar-row .bval{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color: var(--ink-soft);
    width:44px;
    text-align:right;
    flex-shrink:0;
  }

  /* ---- list stats (studio / teacher) ---- */
  .stat-row{
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
  }
  .stat-row:last-child{border-bottom:none;}
  .stat-row .top{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .stat-row .name{
    font-size:15px; font-weight:600;
    font-family:'Fraunces', serif;
  }
  .stat-row .amount{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    font-weight:600;
  }
  .stat-row .count{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .stars{
    margin-top:8px;
    display:flex;
    gap:4px;
  }
  .stars span{
    font-size:19px;
    cursor:pointer;
    color: var(--line-strong);
    line-height:1;
  }
  .stars span.on{ color: var(--c-barre); }

  .pkg-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background: rgba(42,38,32,0.06);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    margin: 6px 6px 0 0;
    color: var(--ink-soft);
  }
  .pkg-chip b{ color: var(--ink); font-weight:600; }
  .pkg-chip .x{ cursor:pointer; color:var(--ink-faint); margin-left:2px; }

  /* ---- punch card ---- */
  .punch-wrap{
    margin-bottom: 6px;
  }
  .punch-type{
    margin-bottom: 18px;
  }
  .punch-type .th{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:9px;
  }
  .punch-type .th .tname{
    font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .punch-type .th .tname svg{ width:17px; height:17px; }
  .punch-type .th .tcount{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .punch-grid{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .punch-dot{
    width:16px; height:16px;
    border-radius:50%;
    border: 1.5px solid var(--line-strong);
    box-sizing:border-box;
  }
  .punch-dot.filled{
    border-color: transparent;
  }

  .grand-total{
    text-align:center;
    padding: 8px 0 22px;
  }
  .grand-total .num{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 52px;
    line-height:1;
  }
  .grand-total .sub{
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--ink-soft);
    margin-top:8px;
    font-weight:600;
  }

  /* ---- bottom nav ---- */
  nav.tabbar{
    position:fixed;
    bottom:0; left:50%;
    transform: translateX(-50%);
    width:100%;
    max-width:460px;
    background: rgba(251,248,241,0.92);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    display:flex;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index: 5;
  }
  nav.tabbar .tab{
    flex:1;
    text-align:center;
    padding: 8px 2px 4px;
    cursor:pointer;
    color: var(--ink-faint);
    border-radius: 10px;
  }
  nav.tabbar .tab .ic{
    font-size:18px;
    display:block;
  }
  nav.tabbar .tab .tl{
    font-size:10.5px;
    font-weight:600;
    margin-top:3px;
    letter-spacing:0.02em;
  }
  nav.tabbar .tab.active{
    color: var(--ink);
  }

  h2.page-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    margin: 8px 2px 14px;
  }

  select{
    -webkit-appearance:none;
    appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0' fill='none' stroke='%236E6656' stroke-width='1.4'/></svg>");
    background-repeat:no-repeat;
    background-position: right 12px center;
    padding-right: 30px;
  }

  ::placeholder{ color: var(--ink-faint); }

  .toast{
    position:fixed;
    bottom: 96px; left:50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg-card);
    padding: 10px 18px;
    border-radius: 20px;
    font-size:13px;
    font-weight:500;
    z-index: 20;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 80vw;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(-4px);
  }

  /* ---- auth screen ---- */
  #authScreen{
    width:100%; max-width:460px; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 30px 26px; position:relative; z-index:1;
  }
  #authScreen .brand{
    font-family:'Fraunces', serif; font-weight:600; font-size:30px; margin-bottom:6px;
  }
  #authScreen .sub{
    font-size:13px; color:var(--ink-soft); margin-bottom:28px; text-align:center; line-height:1.6;
  }
  #authScreen .card{ width:100%; }
  #authScreen .hint{
    font-size:12px; color:var(--ink-faint); margin-top:14px; text-align:center; line-height:1.6;
  }
  .signout-link{
    font-size:11.5px; color:var(--ink-soft); text-decoration:underline;
    cursor:pointer; text-align:right; margin-top:2px;
  }
</style>
</head>
<body>
<div id="authScreen" style="display:none;">
  <div class="brand">打卡簿</div>
  <div class="sub">運動紀錄 · 三部裝置共用同一份資料<br>用 Email 登入即可（免密碼）</div>
  <div class="card" id="authCard"></div>
</div>

<div id="app" style="display:none;">
  <header class="top">
    <div class="brand">打卡簿<small>運動紀錄</small></div>
    <div class="stamp-total">
      累計堂數<b id="headerTotal">0</b>
      <div class="signout-link" id="signOutBtn">登出</div>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <div class="tab" data-tab="log"><span class="ic">✎</span><span class="tl">新增</span></div>
    <div class="tab" data-tab="month"><span class="ic">◔</span><span class="tl">本月</span></div>
    <div class="tab" data-tab="studio"><span class="ic">⌂</span><span class="tl">Studio</span></div>
    <div class="tab" data-tab="teacher"><span class="ic">☆</span><span class="tl">導師</span></div>
    <div class="tab" data-tab="total"><span class="ic">●</span><span class="tl">累計</span></div>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- icons (monoline, currentColor) ---------------- */
const ICONS = {
  reformer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="14.3" width="19" height="2.1" rx="1"/><line x1="4" y1="16.4" x2="4" y2="19.4"/><line x1="19" y1="16.4" x2="19" y2="19.4"/><rect x="9.2" y="12.1" width="6.2" height="2.2" rx="0.6"/><path d="M2.6 15.4 L4.6 13.3 L5.8 14.9 L7 13.2 L8.3 14.9 L9.2 14.2"/><line x1="19.3" y1="8.2" x2="19.3" y2="14.3"/><line x1="17.3" y1="8.2" x2="21.4" y2="8.2"/><circle cx="4" cy="19.6" r="0.55" fill="currentColor" stroke="none"/><circle cx="19" cy="19.6" r="0.55" fill="currentColor" stroke="none"/></svg>',

function fmtMoney(n){

function monthKey(d){ return d.slice(0,7); }
function monthLabel(offset){

  d.setMonth(d.getMonth()+offset);

}
function monthKeyForOffset(offset){
  const d = new Date();
  d.setMonth(d.getMonth()+offset);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function escHtml(s){

}
function escAttr(s){ return escHtml(s); }

function selectableFieldHtml(fieldId, label, list, placeholder){
  return `

        <option value="">請選擇${escHtml(label)}</option>
        ${list.map(v=>`<option value="${escAttr(v)}">${escHtml(v)}</option>`).join('')}
      </select>
      <div class="icon-btn" id="${fieldId}AddBtn">+</div>
    </div>
    <div class="inline-add" id="${fieldId}Inline">
      <input type="text" id="${fieldId}NewInput" placeholder="${placeholder}">
      <button type="button" id="${fieldId}NewConfirm">新增</button>
    </div>
  `;
}
function wireSelectableField(fieldId, list, saveRowFn, onAdded){
  const btn = $('#'+fieldId+'AddBtn');
  const inline = $('#'+fieldId+'Inline');
  const input = $('#'+fieldId+'NewInput');
  const confirm = $('#'+fieldId+'NewConfirm');
  btn.addEventListener('click', ()=>{
    inline.classList.toggle('show');
    if(inline.classList.contains('show')) input.focus();
  });
  const doAdd = async ()=>{
    const v = input.value.trim();
    if(!v){ toast('請輸入名稱'); return; }
    if(!list.includes(v)){
      list.push(v);
      list.sort((a,b)=>a.localeCompare(b));
      await saveRowFn(v);
    }
    const sel = $('#'+fieldId+'Select');
    sel.innerHTML = `<option value="">請選擇</option>` + list.map(x=>`<option value="${escAttr(x)}">${escHtml(x)}</option>`).join('');
    sel.value = v;
    inline.classList.remove('show');
    input.value = '';
    if(onAdded) onAdded(v);
  };
  confirm.addEventListener('click', doAdd);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
}

async function deleteSession(id, afterFn){
  const removed = sessions.find(s=>s.id===id);
  if(!removed) return;
  const { error } = await supabase.from('sessions').delete().eq('id', id);
  if(error){ toast('刪除失敗：'+error.message); return; }
  sessions = sessions.filter(s=>s.id!==id);
  if(removed.paymentType==='package' && removed.packageId){
    const pkg = packages.find(p=>p.id===removed.packageId);
    if(pkg){
      if(pkg.mode==='sessions'){
        pkg.remainingSessions = Math.min(pkg.totalSessions, pkg.remainingSessions + 1);
        await supabase.from('packages').update({remaining_sessions: pkg.remainingSessions}).eq('id', pkg.id);
      } else {
        pkg.remainingAmount = pkg.remainingAmount + removed.price;
        await supabase.from('packages').update({remaining_amount: pkg.remainingAmount}).eq('id', pkg.id);
      }
      toast('已刪除，套票額度已退回 ✓');
    } else {
      toast('已刪除紀錄');
    }
  } else {
    toast('已刪除紀錄');
  }
  if(afterFn) afterFn();
}

async function onSubmitSession(){
  const date = $('#fDate').value;
  const time = $('#fTime').value;
  const studio = $('#fStudioSelect').value;
  const teacher = $('#fTeacherSelect').value;
  if(!date){ toast('請選日期'); return; }
  if(!studio){ toast('請揀 Studio'); return; }

  let price = 0;
  let paymentType = payMode;
  let packageId = null;

  if(payMode==='direct'){
    price = parseFloat($('#fPrice').value) || 0;
  } else if(payMode==='free'){
    price = 0;
  } else if(payMode==='package'){
    const pkg = packages.find(p=>p.id===selectedPackageId);
    if(!pkg){ toast('請選擇套票'); return; }
    if(pkg.studio!==studio){ toast('套票同 Studio 唔相符'); return; }
    packageId = pkg.id;
    if(pkg.mode==='sessions'){
      price = pkg.totalSessions ? pkg.totalAmount/pkg.totalSessions : 0;
      pkg.remainingSessions = Math.max(0, pkg.remainingSessions - 1);
      await supabase.from('packages').update({remaining_sessions: pkg.remainingSessions}).eq('id', pkg.id);
    } else {
      const deduct = parseFloat($('#fPkgDeduct').value) || 0;
      if(deduct<=0){ toast('請填扣減金額'); return; }
      price = deduct;
      pkg.remainingAmount = Math.max(0, pkg.remainingAmount - deduct);
      await supabase.from('packages').update({remaining_amount: pkg.remainingAmount}).eq('id', pkg.id);
    }
  }

  const { data, error } = await supabase.from('sessions').insert({
    date, time, type: selectedType, studio, teacher,
    payment_type: paymentType, package_id: packageId, price
  }).select().single();
  if(error){ toast('儲存失敗：'+error.message); return; }

  sessions.push(mapSession(data));
  sessions.sort((a,b)=> (b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  toast('已記低呢一堂 ✓');
  selectedPackageId = '';
  renderLog();
}

      `).join('') || `<div class="empty">呢個月未有紀錄</div>`}
    </div>

    <div class="section-label">本月明細</div>
    <div class="card" id="monthList"></div>
  `;

  $('#prevM').addEventListener('click', ()=>{ monthOffset--; renderMonth(); });
  $('#nextM').addEventListener('click', ()=>{ if(monthOffset<0){monthOffset++; renderMonth();} });

  $('#monthList').innerHTML = list.length ? list.map(s=>entryRowHtml(s,false)).join('') : `<div class="empty">呢個月未有紀錄</div>`;
}

/* ---------------- STUDIO tab ---------------- */
function renderStudio(){
  const names = [...new Set(sessions.map(s=>s.studio).filter(Boolean))];
  const rows = names.map(name=>{
    const items = sessions.filter(s=>s.studio===name);
    return {name, count:items.length, sum: items.reduce((a,s)=>a+s.price,0)};
  }).sort((a,b)=>b.sum-a.sum);
  const maxSum = Math.max(1, ...rows.map(r=>r.sum));

  main.innerHTML = `
    <h2 class="page-title">Studio 統計</h2>
    <div class="card">
      ${rows.length ? rows.map(r=>`
        <div class="stat-row">
          <div class="top">
            <div class="name">${escHtml(r.name)}</div>
            <div class="amount">${fmtMoney(r.sum)}</div>
          </div>
          <div class="count">共 ${r.count} 堂</div>
          <div class="bar-row" style="margin-top:8px; margin-bottom:0;">
            <div class="btrack"><div class="bfill" style="width:${(r.sum/maxSum*100)}%;background:var(--ink)"></div></div>
          </div>
        </div>
      `).join('') : `<div class="empty">未有 Studio 紀錄</div>`}
    </div>

    <div class="section-label">套票</div>
    <div class="card" id="pkgList"></div>
  `;

  $('#pkgList').innerHTML = packages.length ? packages.map(p=>`
    <div class="stat-row">
      <div class="top">
        <div class="name">${escHtml(p.name)}</div>
        <div class="amount">${pkgBalanceLabel(p)}</div>
      </div>
      <div class="count">${escHtml(p.studio)} · 總值 ${fmtMoney(p.totalAmount)}${p.mode==='sessions'?(' · 共 '+p.totalSessions+' 堂'):''}</div>
    </div>
  `).join('') : `<div class="empty">未有套票，喺「新增」揀「用套票」建立</div>`;
}

/* ---------------- TEACHER tab ---------------- */
function renderTeacher(){
  const names = [...new Set(sessions.map(s=>s.teacher).filter(Boolean))];
  const rows = names.map(name=>{
    const items = sessions.filter(s=>s.teacher===name);
    return {name, count:items.length};
  }).sort((a,b)=>b.count-a.count);

  main.innerHTML = `
    <h2 class="page-title">導師統計 &amp; 評分</h2>
    <div class="card">
      ${rows.length ? rows.map(r=>{
        const rating = ratings[r.name] || 0;
        return `
        <div class="stat-row">
          <div class="top">
            <div class="name">${escHtml(r.name)}</div>
            <div class="amount">${r.count} 堂</div>
          </div>
          <div class="stars" data-name="${escAttr(r.name)}">
            ${[1,2,3,4,5].map(i=>`<span class="${i<=rating?'on':''}" data-v="${i}">★</span>`).join('')}
          </div>
        </div>`;
      }).join('') : `<div class="empty">未有導師紀錄</div>`}
    </div>
  `;

  main.querySelectorAll('.stars').forEach(box=>{
    box.querySelectorAll('span').forEach(star=>{
      star.addEventListener('click', async ()=>{
        const name = box.dataset.name;
        const v = parseInt(star.dataset.v,10);
        const newVal = (ratings[name]===v) ? v-1 : v;
        await saveRating(name, newVal);
        renderTeacher();
      });
    });
  });
}

/* ---------------- TOTAL tab (punch card) ---------------- */
function renderTotal(){
  const totalSpent = sessions.reduce((a,s)=>a+s.price,0);
  const byType = TYPES.map(t=>({
    t, items: sessions.filter(s=>s.type===t.id)
  })).filter(x=>x.items.length>0);

  main.innerHTML = `
    <h2 class="page-title">累計紀錄</h2>
    <div class="card">
      <div class="grand-total">
        <div class="num">${sessions.length}</div>
        <div class="sub">累計總堂數</div>
      </div>
      <div class="bar-row" style="margin-bottom:0;">
        <div class="bname" style="width:auto;">總消費</div>
        <div class="btrack" style="visibility:hidden;"></div>
        <div class="bval" style="width:auto; font-size:14px; font-weight:600; color:var(--ink);">${fmtMoney(totalSpent)}</div>
      </div>
    </div>

    <div class="section-label">各項目打卡</div>
    <div class="card punch-wrap">
      ${byType.length ? byType.map(x=>`
        <div class="punch-type">
          <div class="th">
            <div class="tname" style="color:${x.t.color}">${ICONS[x.t.id]}<span style="color:var(--ink)">${x.t.zh}</span></div>
            <div class="tcount">${x.items.length} 堂 · ${fmtMoney(x.items.reduce((a,s)=>a+s.price,0))}</div>
          </div>
          <div class="punch-grid">
            ${x.items.map(()=>`<div class="punch-dot filled" style="background:${x.t.color}"></div>`).join('')}
          </div>
        </div>
      `).join('') : `<div class="empty">未有紀錄</div>`}
    </div>
  `;
}

/* ---------------- nav ---------------- */
document.querySelectorAll('.tab').forEach(el=>{
  el.addEventListener('click', ()=>{
    currentTab = el.dataset.tab;
    if(currentTab==='month') monthOffset = 0;
    render();
  });
});

/* ---------------- auth flow ---------------- */
function renderAuthCard(message){
  $('#authCard').innerHTML = `
    ${message ? `<div class="pkg-info" style="margin-bottom:12px;">${message}</div>` : ''}
    <label>Email</label>
    <input type="text" id="authEmail" placeholder="you@example.com" autocomplete="email">
    <button class="btn" id="authSendBtn">寄登入連結</button>
    <div class="hint">會收到一封 email，撳入面個連結就自動登入。三部裝置都用返同一個 email 登入，就會見到同一份資料。</div>
  `;
  $('#authSendBtn').addEventListener('click', async ()=>{
    const email = $('#authEmail').value.trim();
    if(!email){ toast('請輸入 email'); return; }
    $('#authSendBtn').textContent = '寄緊...';
    const { error } = await supabase.auth.signInWithOtp({ email, options:{ emailRedirectTo: window.location.href } });
    if(error){ renderAuthCard('寄送失敗：'+error.message); return; }
    renderAuthCard('已寄出登入連結，請去 email 撳連結（記得check埋垃圾郵件）。');
  });
}

function showAuthScreen(message){
  $('#authScreen').style.display = 'flex';
  $('#app').style.display = 'none';
  renderAuthCard(message);
}
function showApp(){
  $('#authScreen').style.display = 'none';
  $('#app').style.display = 'flex';
}

$('#signOutBtn').addEventListener('click', async ()=>{
  await supabase.auth.signOut();
});

supabase.auth.onAuthStateChange((event, session)=>{
  if(session){
    showApp();
    loadData();
  } else {
    showAuthScreen();
  }
});

(async ()=>{
  const { data:{ session } } = await supabase.auth.getSession();
  if(session){ showApp(); loadData(); }
  else { showAuthScreen(); }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
